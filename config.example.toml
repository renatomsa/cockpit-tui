# Config do cockpit — copie para ~/.config/cockpit/config.toml
# (ou rode `cockpit config init`). Toda chave é opcional.

# Tema inicial. Embutidos: dracula, catppuccin-mocha, tokyo-night, nord,
# gruvbox-dark, one-dark, solarized-dark, terminal.
# Temas extras: ~/.config/cockpit/themes/<nome>.toml. A tecla `t` troca ao vivo
# e o último escolhido fica lembrado em ~/.local/state/cockpit/state.toml.
theme = "dracula"

# "pt-BR" ou "en" (nomes de dia e mês).
locale = "pt-BR"

[clock]
seconds = true
hour12 = false

# Relógios extras, mostrados ao lado da cidade atual.
[[clock.extra]]
label = "Orlando"
tz = "America/New_York"

[location]
# Sem `city`, a cidade vem da geolocalização por IP, refeita a cada `refresh_minutes`.
# city = "Rio de Janeiro"
# region = "Rio de Janeiro"
# country = "Brazil"
# timezone = "America/Sao_Paulo"
# lat = -22.9068
# lon = -43.1729
refresh_minutes = 60

[system]
ping_target = "1.1.1.1:443"   # host:porta; mede o tempo de conexão TCP
ping_interval_secs = 5
disks = []                    # vazio = automático; ex.: ["/", "/mnt/c"]
top_n = 5                     # processos em cada lista de ofensores

# Detector de travamento. Amarelo acima de *_warn; vermelho em negrito acima de *_crit.
[system.danger]
mem_warn = 85.0
mem_crit = 93.0
swap_warn = 50.0        # só avisa se a swap estiver subindo
swap_crit = 80.0
psi_mem_warn = 5.0      # % do tempo com tarefas travadas esperando memória
psi_mem_crit = 20.0
cpu_warn = 90.0
cpu_crit = 98.0
cpu_window_secs = 10    # CPU precisa ficar alta por esse tempo
disk_warn = 90.0
disk_crit = 97.0
hysteresis = 3.0        # quanto precisa cair abaixo do limiar para o alerta baixar

[worktrees]
# Pastas varridas atrás de repositórios git; as worktrees vêm de `git worktree list`.
workspaces = ["~"]
depth = 2                     # até quantos níveis abaixo de cada pasta procurar
only_with_worktrees = false   # true = esconde repositórios sem worktrees extras
sizes = true                  # tamanho em disco (calculado em segundo plano a cada 10 min)
refresh_secs = 30             # git status de cada worktree

[claude]
# dir = "~/.claude"           # padrão: $CLAUDE_CONFIG_DIR ou ~/.claude
recent_hours = 24             # conversas encerradas há menos disso aparecem em "recentes"
recent_max = 5
# Limites do plano (sessão de 5 h e semana), os mesmos do `/usage`. Lê o login do
# Claude Code em ~/.claude/.credentials.json e consulta api.anthropic.com. O token só
# é lido; nunca é renovado nem gravado pelo cockpit.
usage_limits = true
usage_refresh_secs = 180

[calendar]
# Google Calendar. Passo a passo no README (seção Google Calendar); depois rode
# `cockpit auth google`. O token fica em ~/.local/state/cockpit/google_token.json (0600).
enabled = true
client_secret = "~/.config/cockpit/google_client.json"
calendars = []                  # vazio = as agendas visíveis no Google Calendar
exclude = []                    # ex.: ["Feriados no Brasil"]
refresh_secs = 60
lookahead_hours = 48
alert_minutes = 5               # tela vermelha quando faltam até 5 min…
alert_after_start_minutes = 5   # …e até 5 min depois do início
soon_minutes = 15               # aviso amarelo quando faltam até 15 min
snooze_minutes = 5              # quanto o `z` adia o alerta
show_declined = false

[terminal]
# Como abrir a aba nova do `C` (worktrees) e do `r` (conversas). Vazio = automático:
# tmux → Windows Terminal (WSL) → kitty → WezTerm → gnome-terminal.
# {dir}, {cmd} e {title} são substituídos já com aspas; roda com `sh -c`.
# new_tab = "alacritty --working-directory {dir} -e zsh -lic {cmd}"
new_tab = ""

[layout]
wide_min_cols = 110     # a partir daqui, duas colunas
compact_max_rows = 30   # abaixo daqui, só o hero
left_percent = 62       # largura da coluna esquerda
